services:
  ofelia:
    restart: unless-stopped
  frontend:
    restart: unless-stopped
    build: !reset null
    image: ${TURTL_FRONTEND_IMAGE:?Set TURTL_FRONTEND_IMAGE to the published image digest}
  backend:
    build: !reset null
    image: ${TURTL_BACKEND_IMAGE:?Set TURTL_BACKEND_IMAGE to the published image digest}
    post_start: !reset []
