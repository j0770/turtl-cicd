version: 2
updates:
  # Python Dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Vue Frontend Dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Backend Dockerfile Base Images
  - package-ecosystem: "docker"
    directory: "/deploy/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Frontend Dockerfile Base Images
  - package-ecosystem: "docker"
    directory: "/deploy/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
