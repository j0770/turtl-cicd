name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting (advisory during baseline assessment)
        continue-on-error: true
        run: npx prettier --check src/

      - name: Lint source code (advisory for existing findings)
        continue-on-error: true
        run: npx eslint . --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts --ignore-path .gitignore

      - name: Check TypeScript and Vue types
        run: npm run type-check

      - name: Run unit tests (advisory until frontend tests exist)
        continue-on-error: true
        run: npm run test:unit -- --run

      - name: Validate production build
        run: npm run build-only

  backend:
    name: Backend tests and security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: turtl_test_db
          POSTGRES_USER: turtl_user
          POSTGRES_PASSWORD: turtl_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turtl_user -d turtl_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        command: redis-server --requirepass turtl_redis_password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a turtl_redis_password ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: turtl_test_db
      POSTGRES_USER: turtl_user
      POSTGRES_PASSWORD: turtl_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_PASSWORD: turtl_redis_password
      REDIS_HOST: localhost
      REDIS_PORT: "6379"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip install coverage==7.16.0 pip-audit==2.10.1 ruff==0.16.6

      - name: Run Django system checks
        run: python manage.py check

      - name: Check Python for critical errors
        run: ruff check --select E9,F63,F7,F82 --exclude migrations .

      - name: Run tests with coverage
        run: |
          coverage run --source=analytics,authentication,catalog,enrollments,seeder,shell,turtl,vm_manager manage.py test
          coverage report --show-missing
          coverage xml

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Audit Python dependencies (advisory for existing findings)
        continue-on-error: true
        run: pip-audit --requirement requirements.txt

  infrastructure:
    name: Infrastructure configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare non-secret validation files
        run: |
          cp deploy/.env.example deploy/.env
          mkdir -p deploy/certs
          touch deploy/certs/turtl.crt deploy/certs/turtl.key deploy/certs/proxmox-ca.pem

      - name: Validate Docker Compose model
        run: docker compose --file deploy/docker-compose.yaml config --quiet

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
